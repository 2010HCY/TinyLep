[package]
name = "TinyLep"
version = "0.1.0"
description = "Lepton 批量压缩工具"
authors = ["Ethaniel <Ethaniel@HcyHub.com>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0-rc", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-prevent-default = "2"
lepton_jpeg = { path = "./lib" } 
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = []
avx = []

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"     # unwind、abort
strip = true

[package.metadata.tauri-winres]
ProductName = "TinyLep"
LegalCopyright = "Copyright © 2026 Ethaniel <Ethaniel@HcyHub.com>"
OriginalFilename = "TinyLep.exe"
CompanyName = "Ethaniel"
