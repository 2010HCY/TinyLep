<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>TinyLep</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <!-- 多语言切换 -->
    <div class="top-bar">
        <div class="lang-selector">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
            <select id="lang-select">
                <option value="zh">简体中文</option>
                <option value="en">English</option>
                <option value="es">Español</option>
                <option value="fr">Français</option>
                <option value="ru">Русский</option>
                <option value="ar">العربية</option>
                <option value="ja">日本語</option>
                <option value="ko">한국어</option>
            </select>
        </div>
        <div class="sponsor-container">
            <div class="sponsor-icon-wrapper" id="btn-sponsor-modal">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
                    <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
                    <line x1="6" y1="1" x2="6" y2="4"></line>
                    <line x1="10" y1="1" x2="10" y2="4"></line>
                    <line x1="14" y1="1" x2="14" y2="4"></line>
                </svg>
                <span data-i18n="txtSponsorBtn">赞助</span>
            </div>
            <div class="sponsor-dropdown">
                <img src="PayQrcode.jpg" class="sponsor-qrcode-img">
                <p style="margin: 5px 0 0; font-size: 12px; color: var(--text-muted); text-align: center;">打赏作者</p>
            </div>
        </div>
    </div>

    <!-- 导入页 -->
    <div id="view-import" class="view active">
        <div id="drop-zone">
            <div class="icon">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            </div>
            <h2 data-i18n="dropTitle">点击或拖拽文件/文件夹到此处</h2>
            <p data-i18n="dropSub">支持 .jpg / .jpeg / .lep 双向自动转换</p>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button id="btn-select-file" class="btn primary" data-i18n="btnSelect">选择文件</button>
                <button id="btn-select-folder" class="btn primary" data-i18n="btnSelectFolder">选择文件夹</button>
            </div>
        </div>
    </div>

    <!-- 设置处理页 -->
    <div id="view-process" class="view">
        <div class="settings-panel">
            <!-- 进度条与总计区域 -->
            <div class="progress-container" id="progress-container">
                <div class="progress-wrapper" id="progress-wrapper">
                    <span class="progress-label" data-i18n="lblTask">任务:</span>
                    <div class="progress-track">
                        <div class="progress-fill" id="progress-fill" style="width: 0%;"></div>
                        <div class="progress-text" id="progress-text">0/0</div>
                    </div>
                </div>
                <!-- 底部统计数据展示 -->
                <div class="progress-stats">
                    <span><span data-i18n="statTotal">总大小:</span> <span id="val-total-before" style="font-weight: 500; color: var(--text-main);">0 B</span></span>
                    <span><span data-i18n="statAfter">压缩后:</span> <span id="val-total-after" style="font-weight: 500; color: var(--text-main);">--</span></span>
                    <span><span data-i18n="statRatio">总压缩率:</span> <span id="val-total-ratio" style="font-weight: 500; color: var(--text-main);">--</span></span>
                </div>
            </div>

            <div class="options-row">
                <div class="setting-item">
                    <input type="checkbox" id="chk-no-progressive"/>
                    <label for="chk-no-progressive" data-i18n="optNoProg">跳过渐进式JPEG</label>
                </div>
                <div class="setting-item">
                    <input type="checkbox" id="chk-accept-dqt" checked />
                    <label for="chk-accept-dqt" data-i18n="optAcceptDqt">接受异常 DQT</label>
                </div>
                <div class="setting-item">
                    <input type="checkbox" id="chk-keep-structure" checked />
                    <label for="chk-keep-structure" data-i18n="optKeepStruct">保留原有结构</label>
                </div>
                <div class="setting-item">
                    <input type="checkbox" id="chk-delete-source" />
                    <label for="chk-delete-source" data-i18n="optDeleteSource">压缩后删除源文件</label>
                </div>
            </div>
            <div class="setting-item output-dir">
                <span data-i18n="lblOutDir">输出目录：</span>
                <span id="output-dir-path" data-i18n="txtDefaultDir">默认目录</span>
                <button id="btn-select-dir" class="btn sm" data-i18n="btnChange">选择目录</button>
            </div>
            <div class="action-bar">
                <button id="btn-back" class="btn" data-i18n="btnBack">返回重选</button>
                <button id="btn-clear" class="btn" data-i18n="btnClear">清除列表</button>
                <button id="btn-start" class="btn primary" data-i18n="btnStart">开始压缩</button>
            </div>
        </div>

        <div class="list-header">
            <div class="col-name" data-i18n="colName">文件名</div>
            <div class="col-size" data-i18n="colBefore">处理前</div>
            <div class="col-size" data-i18n="colAfter">处理后</div>
            <div class="col-ratio" data-i18n="colRatio">压缩率</div>
            <div class="col-action" data-i18n="colAction">操作</div>
        </div>
        <div id="file-list" class="file-list"></div>
    </div>

    <div id="modal-conflict" class="modal-overlay hidden">
        <div class="modal">
            <div class="modal-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 512 512" fill="var(--danger)"><path d="M256 0c14.7 0 28.2 8.1 35.2 21l216 400c6.7 12.4 6.4 27.4-.8 39.5S486.1 480 472 480L40 480c-14.1 0-27.2-7.4-34.4-19.5s-7.5-27.1-.8-39.5l216-400c7-12.9 20.5-21 35.2-21zm0 352a32 32 0 1 0 0 64 32 32 0 1 0 0-64zm0-192c-18.2 0-32.7 15.5-31.4 33.7l7.4 104c.9 12.5 11.4 22.3 23.9 22.3 12.6 0 23-9.7 23.9-22.3l7.4-104c1.3-18.2-13.1-33.7-31.4-33.7z"/></svg>
            </div>
            <h3 data-i18n="warnTitle">文件冲突</h3>
            <p data-i18n="warnDesc">目标文件夹中已存在同名文件，继续操作以下文件将被覆盖：</p>
            <ul id="conflict-list"></ul>
            <div class="modal-actions">
                <button id="btn-modal-cancel" class="btn" data-i18n="btnCancel">取消</button>
                <button id="btn-modal-confirm" class="btn danger" data-i18n="btnConfirm">确认覆盖</button>
            </div>
        </div>
    </div>

    <div id="modal-sponsor" class="modal-overlay hidden">
        <div class="modal" style="position: relative; width: 476px; text-align: center; padding: 30px 20px 20px;">
            <button id="btn-close-sponsor" class="btn-icon" style="position: absolute; top: 10px; right: 10px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M55.1 73.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L147.2 256 9.9 393.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192.5 301.3 329.9 438.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.8 256 375.1 118.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192.5 210.7 55.1 73.4z"/>
                </svg>
            </button>
            <h3 style="margin: 0 0 10px 0; color: var(--text-main);" data-i18n="sponsorTitle">感谢支持</h3>
            <!--<p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;" data-i18n="sponsorDesc"></p>-->
            <img src="PayQrcode.jpg" style="width: 396px; height: 220px; border-radius: 8px; border: 1px solid var(--border-color); object-fit: contain;">
        </div>
    </div>

    <template id="tpl-trash-icon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
    </template>

    <script type="module" src="main.js"></script>
</body>
</html>
